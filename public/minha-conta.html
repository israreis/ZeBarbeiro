<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha conta | Zé Barbeiro</title>
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"
    defer></script>
  <script type="module" src="js/pages/minha-conta.js"></script>
</head>

<body data-nav="conta">
  <div id="app-header"></div>

  <main id="conteudo" class="app-main">
    <div class="container">
      <div class="page-head">
        <div>
          <h1 class="page-title">Minha conta</h1>
          <p class="page-lead" data-perfil-descricao></p>
        </div>
      </div>

      <div class="row g-4 align-items-start">
        <section class="col-lg-7" aria-labelledby="titulo-dados">
          <form id="form-perfil" class="panel panel-form" novalidate>
            <h2 class="panel-title" id="titulo-dados">Dados pessoais</h2>
            <div class="row g-3">
              <div class="col-12">
                <label for="perfil-nome" class="form-label">Nome completo</label>
                <input type="text" class="form-control" id="perfil-nome" name="nome" maxlength="120"
                  autocomplete="name" required>
              </div>
              <div class="col-md-6">
                <label for="perfil-telefone" class="form-label">Celular</label>
                <input type="tel" class="form-control" id="perfil-telefone" name="telefone"
                  placeholder="(31)99999-9999" autocomplete="tel" required>
              </div>
              <div class="col-md-6">
                <label for="perfil-nascimento" class="form-label">Nascimento <span class="form-hint">(opcional)</span></label>
                <input type="date" class="form-control" id="perfil-nascimento" name="dataNascimento" autocomplete="bday">
              </div>
              <div class="col-12">
                <label for="perfil-email" class="form-label">E-mail de acesso</label>
                <input type="email" class="form-control" id="perfil-email" name="email" autocomplete="email" required
                  aria-describedby="perfil-email-dica">
                <p class="form-hint mt-1 mb-0" id="perfil-email-dica">É o e-mail que você usa para entrar no sistema.</p>
              </div>
              <div class="col-12 reveal" data-confirmar-senha hidden>
                <label for="perfil-senha-atual" class="form-label">Senha atual</label>
                <input type="password" class="form-control" id="perfil-senha-atual" name="senhaAtual"
                  autocomplete="current-password" aria-describedby="perfil-senha-dica">
                <p class="form-hint mt-1 mb-0" id="perfil-senha-dica">
                  Por segurança, confirme sua senha para alterar o e-mail. Outros dispositivos conectados serão desconectados.
                </p>
              </div>
            </div>
            <div class="panel-actions">
              <button type="reset" class="btn-ghost">Descartar alterações</button>
              <button type="submit" class="btn-app">Salvar alterações</button>
            </div>
          </form>
        </section>

        <section class="col-lg-5" aria-labelledby="titulo-senha">
          <form id="form-senha" class="panel panel-form" novalidate>
            <h2 class="panel-title" id="titulo-senha">Alterar senha</h2>
            <label for="senha-atual" class="form-label">Senha atual</label>
            <input type="password" class="form-control mb-3" id="senha-atual" name="senhaAtual"
              autocomplete="current-password" required>
            <label for="senha-nova" class="form-label">Nova senha</label>
            <input type="password" class="form-control" id="senha-nova" name="novaSenha" minlength="8"
              autocomplete="new-password" required aria-describedby="senha-nova-dica">
            <p class="form-hint mt-1 mb-3" id="senha-nova-dica">Mínimo de 8 caracteres.</p>
            <label for="senha-confirmacao" class="form-label">Confirmar nova senha</label>
            <input type="password" class="form-control" id="senha-confirmacao" name="confirmarNovaSenha"
              autocomplete="new-password" required>
            <div class="panel-actions">
              <button type="submit" class="btn-app">Alterar senha</button>
            </div>
          </form>
        </section>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>
</body>

</html>
