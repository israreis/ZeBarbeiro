<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unidades | Zé Barbeiro</title>
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"
    defer></script>
  <script type="module" src="js/pages/admin-unidades.js"></script>
</head>

<body data-nav="unidades">
  <div id="app-header"></div>

  <main>
    <h1 class="page-title">UNIDADES CADASTRADAS</h1>
    <div class="table-wrapper">
      <table class="table table-app">
        <thead>
          <tr>
            <th scope="col">UNIDADE</th>
            <th scope="col" class="hide-sm">ENDEREÇO</th>
            <th scope="col">TELEFONE</th>
            <th scope="col" class="hide-sm">E-MAIL</th>
            <th scope="col"><span class="visually-hidden">Ações</span></th>
          </tr>
        </thead>
        <tbody id="tabela-registros"></tbody>
      </table>
    </div>
    <div class="page-actions">
      <button type="button" class="btn-app" id="btn-novo">CADASTRAR NOVA UNIDADE</button>
    </div>

    <div class="modal fade" id="modal-registro" tabindex="-1" aria-labelledby="modal-registro-titulo" aria-hidden="true">
      <div class="modal-dialog">
        <form class="modal-content" id="form-registro" novalidate>
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="modal-registro-titulo"></h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">
            <label for="unidade-nome" class="form-label">Unidade</label>
            <input type="text" class="form-control" id="unidade-nome" name="nome" maxlength="60" required>
            <label for="unidade-endereco" class="form-label">Endereço</label>
            <input type="text" class="form-control" id="unidade-endereco" name="endereco" maxlength="200" required>
            <label for="unidade-telefone" class="form-label">Telefone</label>
            <input type="tel" class="form-control" id="unidade-telefone" name="telefone" placeholder="(31)99999-9999" required>
            <label for="unidade-email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="unidade-email" name="email" required>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-app" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn-app">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>
</body>

</html>
