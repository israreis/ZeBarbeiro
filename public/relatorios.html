<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatórios | Zé Barbeiro</title>
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"
    defer></script>
  <script type="module" src="js/pages/relatorios.js"></script>
</head>

<body data-nav="relatorios">
  <div id="app-header"></div>

  <main id="conteudo" class="app-main">
    <div class="container">
      <div class="page-head">
        <div>
          <h1 class="page-title">Relatórios</h1>
          <p class="page-lead" data-lead></p>
        </div>
        <div class="page-actions">
          <button type="button" class="btn-ghost" id="btn-excel">Baixar Excel</button>
          <button type="button" class="btn-app" id="btn-pdf">Baixar PDF</button>
        </div>
      </div>

      <section class="panel panel-filters" aria-label="Filtros">
        <form id="form-filtros" class="filter-form" novalidate>
          <label class="field">Período
            <select class="form-select" name="periodo"></select>
          </label>
          <label class="field" data-periodo-personalizado hidden>De
            <input class="form-control" type="date" name="inicio">
          </label>
          <label class="field" data-periodo-personalizado hidden>Até
            <input class="form-control" type="date" name="fim">
          </label>
          <label class="field field-grow" data-filtro-barbeiro>Barbeiro
            <select class="form-select" name="barbeiroId"></select>
          </label>
          <span class="filter-period" data-periodo-texto aria-live="polite"></span>
        </form>
      </section>

      <section class="kpi-grid" id="kpis" aria-label="Indicadores principais" aria-live="polite"></section>

      <section class="panel mt-4" aria-labelledby="titulo-por-barbeiro" data-somente-admin>
        <h2 class="panel-heading" id="titulo-por-barbeiro">Desempenho por barbeiro</h2>
        <div class="table-wrapper">
          <table class="table table-hover table-app">
            <thead>
              <tr>
                <th scope="col">Barbeiro</th>
                <th scope="col" class="text-end">Agendamentos</th>
                <th scope="col" class="text-end hide-sm">Concluídos</th>
                <th scope="col" class="text-end hide-sm">Cancelados</th>
                <th scope="col" class="text-end hide-sm">Ticket médio</th>
                <th scope="col" class="text-end">Faturamento</th>
              </tr>
            </thead>
            <tbody id="tabela-barbeiros"></tbody>
          </table>
        </div>
      </section>

      <section class="panel mt-4" aria-labelledby="titulo-atendimentos">
        <h2 class="panel-heading" id="titulo-atendimentos">Atendimentos <span class="panel-heading-meta" data-total></span></h2>
        <div class="table-wrapper">
          <table class="table table-hover table-app">
            <thead>
              <tr>
                <th scope="col">Data</th>
                <th scope="col">Horário</th>
                <th scope="col" data-somente-admin>Barbeiro</th>
                <th scope="col">Cliente</th>
                <th scope="col" class="hide-sm">Serviço</th>
                <th scope="col">Status</th>
                <th scope="col" class="text-end">Valor</th>
              </tr>
            </thead>
            <tbody id="tabela-atendimentos"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <div id="app-footer"></div>
</body>

</html>
