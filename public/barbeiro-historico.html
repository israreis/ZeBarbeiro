<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico | Zé Barbeiro</title>
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"
    defer></script>
  <script type="module" src="js/pages/barbeiro-historico.js"></script>
</head>

<body data-nav="historico">
  <div id="app-header"></div>

  <main id="conteudo" class="app-main">
    <div class="container">
      <div class="page-head">
        <div>
          <h1 class="page-title">Histórico</h1>
          <p class="page-lead">Seus atendimentos por período.</p>
        </div>
      </div>
      <section class="panel panel-filters" aria-label="Filtros">
        <form id="form-historico" class="filter-form" novalidate>
          <label class="field">De
            <input class="form-control" type="date" name="inicio" required>
          </label>
          <label class="field">Até
            <input class="form-control" type="date" name="fim" required>
          </label>
          <button type="submit" class="btn-app">Buscar</button>
          <fieldset class="situacao segmented">
            <legend class="visually-hidden">Situação</legend>
            <input type="radio" name="situacao" id="situacao-pendentes" value="pendentes" checked>
            <label for="situacao-pendentes">Em aberto</label>
            <input type="radio" name="situacao" id="situacao-concluidos" value="concluidos">
            <label for="situacao-concluidos">Concluídos</label>
          </fieldset>
        </form>
      </section>
      <section class="panel" aria-label="Resultados">
        <div class="table-wrapper">
          <table class="table table-hover table-app">
            <thead>
              <tr>
                <th scope="col">Data</th>
                <th scope="col">Horário</th>
                <th scope="col">Cliente</th>
                <th scope="col" class="hide-sm">Serviço</th>
                <th scope="col" class="hide-sm">Valor</th>
                <th scope="col">Status</th>
              </tr>
            </thead>
            <tbody id="tabela-historico"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <div id="app-footer"></div>
</body>

</html>
