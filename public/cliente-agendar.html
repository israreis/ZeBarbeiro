<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar horário | Zé Barbeiro</title>
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"
    defer></script>
  <script type="module" src="js/pages/cliente-agendar.js"></script>
</head>

<body data-nav="agendar">
  <div id="app-header"></div>

  <main id="conteudo" class="app-main">
    <div class="container">
      <div class="page-head">
        <div>
          <h1 class="page-title">Agendar horário</h1>
          <p class="page-lead">Escolha o serviço e a data. Mostramos os barbeiros com horários livres.</p>
        </div>
        <a class="btn-ghost" href="cliente-agendamentos.html">Meus agendamentos</a>
      </div>

      <section class="panel panel-filters" aria-label="O que você procura">
        <form id="form-busca" class="filter-form" novalidate>
          <label class="field field-grow">Serviço
            <select class="form-select" name="servicoId" required></select>
          </label>
          <label class="field field-grow">Barbeiro
            <select class="form-select" name="barbeiroId"></select>
          </label>
          <label class="field">Data
            <input class="form-control" type="date" name="data" required>
          </label>
          <button type="submit" class="btn-app">Buscar horários</button>
        </form>
      </section>

      <section class="availability" id="disponibilidade" aria-live="polite" aria-label="Barbeiros e horários livres"></section>
    </div>
  </main>

  <div class="booking-bar" id="barra-confirmacao" hidden>
    <div class="container booking-bar-inner">
      <p class="booking-bar-text" data-resumo></p>
      <button type="button" class="btn-app" id="btn-confirmar">Confirmar agendamento</button>
    </div>
  </div>

  <div id="app-footer"></div>
</body>

</html>
