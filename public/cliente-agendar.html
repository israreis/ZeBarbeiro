<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar | Zé Barbeiro</title>
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"
    defer></script>
  <script type="module" src="js/pages/cliente-agendar.js"></script>
</head>

<body data-nav="agendar">
  <div id="app-header"></div>

  <main>
    <h1 class="page-title">AGENDAR</h1>
    <form id="form-agendar" class="filter-form" novalidate>
      <label class="field">Barbeiro
        <select name="barbeiroId" required></select>
      </label>
      <label class="field">Serviço
        <select name="servicoId"></select>
      </label>
      <label class="field">Data
        <input type="date" name="data" required>
      </label>
      <button type="submit" class="btn-app">Buscar</button>
    </form>
    <div class="table-wrapper">
      <table class="table table-app">
        <thead>
          <tr>
            <th scope="col">DATA</th>
            <th scope="col">BARBEIRO</th>
            <th scope="col" class="hide-sm">SERVIÇO</th>
            <th scope="col" class="hide-sm">VALOR</th>
            <th scope="col">HORÁRIO</th>
            <th scope="col">STATUS</th>
            <th scope="col"><span class="visually-hidden">Selecionar</span></th>
          </tr>
        </thead>
        <tbody id="tabela-agenda"></tbody>
      </table>
    </div>
    <div class="page-actions">
      <button type="button" class="btn-app" id="btn-agendar">Agendar Horário</button>
      <button type="button" class="btn-app" id="btn-cancelar">Cancelar Agendamento</button>
    </div>
  </main>

  <div id="app-footer"></div>
</body>

</html>
