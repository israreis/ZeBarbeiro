<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha agenda | Zé Barbeiro</title>
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"
    defer></script>
  <script type="module" src="js/pages/barbeiro-agenda.js"></script>
</head>

<body data-nav="agenda">
  <div id="app-header"></div>

  <main id="conteudo" class="app-main">
    <div class="container">
      <div class="page-head">
        <div>
          <h1 class="page-title">Minha agenda</h1>
          <p class="page-lead">Marque os horários na tabela e escolha a ação.</p>
        </div>
      </div>
      <section class="panel panel-filters" aria-label="Filtros">
        <form id="form-agenda" class="filter-form" novalidate>
          <label class="field">Data
            <input class="form-control" type="date" name="data" required>
          </label>
          <button type="submit" class="btn-app">Ver agenda</button>
        </form>
      </section>
      <section class="panel" aria-label="Resultados">
        <div class="table-wrapper">
          <table class="table table-hover table-app">
            <thead>
              <tr>
                <th scope="col"><span class="visually-hidden">Selecionar</span></th>
                <th scope="col">Horário</th>
                <th scope="col">Cliente</th>
                <th scope="col" class="hide-sm">Serviço</th>
                <th scope="col" class="hide-sm">Valor</th>
                <th scope="col">Status</th>
              </tr>
            </thead>
            <tbody id="tabela-agenda"></tbody>
          </table>
        </div>
        <div class="action-bar">
          <span class="selection-count" data-selection-count aria-live="polite">Nenhum horário selecionado</span>
          <div class="action-buttons">
            <button type="button" class="btn-ghost" id="btn-incluir">Incluir atendimento</button>
            <button type="button" class="btn-ghost" id="btn-bloquear">Bloquear</button>
            <button type="button" class="btn-ghost" id="btn-cancelar">Desfazer bloqueio/atendimento</button>
            <button type="button" class="btn-app" id="btn-concluir">Concluir atendimento</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div id="app-footer"></div>
</body>

</html>
