<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha agenda | Zé Barbeiro</title>
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"
    defer></script>
  <script type="module" src="js/pages/barbeiro-agenda.js"></script>
</head>

<body data-nav="agenda">
  <div id="app-header"></div>

  <main id="conteudo" class="app-main">
    <div class="container">
      <div class="page-head">
        <div>
          <h1 class="page-title">Minha agenda</h1>
          <p class="page-lead">Veja seus horários do dia, inclua atendimentos e gerencie bloqueios.</p>
        </div>
        <button type="button" class="btn-app" id="btn-novo-atendimento">Incluir atendimento</button>
      </div>

      <section class="panel panel-filters" aria-label="Data da agenda">
        <form id="form-agenda" class="filter-form" novalidate>
          <label class="field">Data
            <input class="form-control" type="date" name="data" required>
          </label>
          <button type="submit" class="btn-ghost">Ver agenda</button>
        </form>
      </section>

      <section class="panel" aria-label="Horários do dia">
        <div class="table-toolbar">
          <span class="selection-count" data-selection-count aria-live="polite">Nenhum horário selecionado</span>
          <div class="action-buttons" role="group" aria-label="Ações para os horários selecionados">
            <button type="button" class="btn-ghost btn-sm-app" id="btn-bloquear" disabled>Bloquear</button>
            <button type="button" class="btn-ghost btn-sm-app" id="btn-cancelar" disabled>Desfazer bloqueio/atendimento</button>
            <button type="button" class="btn-ghost btn-sm-app" id="btn-concluir" disabled>Concluir atendimento</button>
          </div>
        </div>
        <div class="table-wrapper">
          <table class="table table-hover table-app">
            <thead>
              <tr>
                <th scope="col"><span class="visually-hidden">Selecionar</span></th>
                <th scope="col">Horário</th>
                <th scope="col">Cliente</th>
                <th scope="col" class="hide-sm">Serviço</th>
                <th scope="col" class="hide-sm">Valor</th>
                <th scope="col">Status</th>
              </tr>
            </thead>
            <tbody id="tabela-agenda"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <div class="modal fade" id="modal-atendimento" tabindex="-1" aria-labelledby="modal-atendimento-titulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="form-atendimento" novalidate>
        <div class="modal-header">
          <h2 class="modal-title" id="modal-atendimento-titulo">Incluir atendimento</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <p class="form-hint required-legend"><span class="required-mark" aria-hidden="true">*</span> Campos obrigatórios</p>
          <div class="row g-3">
            <div class="col-6">
              <label for="atendimento-data" class="form-label">Data</label>
              <input type="date" class="form-control" id="atendimento-data" name="data" required>
            </div>
            <div class="col-6">
              <label for="atendimento-horario" class="form-label">Horário</label>
              <select class="form-select" id="atendimento-horario" name="horario" required></select>
            </div>
            <div class="col-md-7">
              <label for="atendimento-cliente-nome" class="form-label">Nome do cliente</label>
              <input type="text" class="form-control" id="atendimento-cliente-nome" name="clienteNome" maxlength="120"
                autocomplete="off" required>
            </div>
            <div class="col-md-5">
              <label for="atendimento-cliente-telefone" class="form-label">Celular <span class="form-hint">(opcional)</span></label>
              <input type="tel" class="form-control" id="atendimento-cliente-telefone" name="clienteTelefone"
                placeholder="(31)99999-9999" autocomplete="off">
            </div>
            <div class="col-12">
              <label for="atendimento-servico" class="form-label">Serviço</label>
              <select class="form-select" id="atendimento-servico" name="servicoId" required></select>
            </div>
          </div>
          <dl class="booking-summary">
            <div>
              <dt>Valor</dt>
              <dd data-resumo-valor>—</dd>
            </div>
            <div>
              <dt>Status</dt>
              <dd data-resumo-status></dd>
            </div>
          </dl>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-ghost" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn-app">Incluir atendimento</button>
        </div>
      </form>
    </div>
  </div>

  <div id="app-footer"></div>
</body>

</html>
