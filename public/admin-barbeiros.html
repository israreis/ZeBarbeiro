<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbeiros | Zé Barbeiro</title>
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"
    defer></script>
  <script type="module" src="js/pages/admin-barbeiros.js"></script>
</head>

<body data-nav="barbeiros">
  <div id="app-header"></div>

  <main>
    <h1 class="page-title">BARBEIROS CADASTRADOS</h1>
    <div class="table-wrapper">
      <table class="table table-app">
        <thead>
          <tr>
            <th scope="col">BARBEIRO</th>
            <th scope="col" class="hide-sm">SERVIÇOS</th>
            <th scope="col" class="hide-sm">AGENDA</th>
            <th scope="col">STATUS</th>
            <th scope="col"><span class="visually-hidden">Ações</span></th>
          </tr>
        </thead>
        <tbody id="tabela-registros"></tbody>
      </table>
    </div>
    <div class="page-actions">
      <button type="button" class="btn-app" id="btn-novo">CADASTRAR NOVO</button>
    </div>

    <div class="modal fade" id="modal-registro" tabindex="-1" aria-labelledby="modal-registro-titulo" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <form class="modal-content" id="form-registro" novalidate>
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="modal-registro-titulo"></h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">
            <h3 class="modal-section-title">Dados do Barbeiro</h3>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="barbeiro-nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="barbeiro-nome" name="nome" maxlength="120" required>
              </div>
              <div class="col-md-6">
                <label for="barbeiro-email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="barbeiro-email" name="email" autocomplete="off" required>
              </div>
              <div class="col-md-6" data-only="create">
                <label for="barbeiro-confirmar-email" class="form-label">Confirmar e-mail</label>
                <input type="email" class="form-control" id="barbeiro-confirmar-email" name="confirmarEmail" autocomplete="off" required>
              </div>
              <div class="col-md-6">
                <label for="barbeiro-senha" class="form-label" id="label-senha">Senha</label>
                <input type="password" class="form-control" id="barbeiro-senha" name="senha" minlength="8" autocomplete="new-password">
              </div>
              <div class="col-md-6" data-only="create">
                <label for="barbeiro-confirmar-senha" class="form-label">Confirmar senha</label>
                <input type="password" class="form-control" id="barbeiro-confirmar-senha" name="confirmarSenha" autocomplete="new-password">
              </div>
              <div class="col-md-6">
                <label for="barbeiro-telefone" class="form-label">Telefone</label>
                <input type="tel" class="form-control" id="barbeiro-telefone" name="telefone" placeholder="(31)99999-9999" required>
              </div>
              <div class="col-md-6">
                <label for="barbeiro-nascimento" class="form-label">Data de nascimento</label>
                <input type="date" class="form-control" id="barbeiro-nascimento" name="dataNascimento">
              </div>
              <div class="col-md-6">
                <label for="campo-ativo" class="form-label">Status</label>
                <select class="form-select" id="campo-ativo" name="ativo">
                  <option value="true">Ativo</option>
                  <option value="false">Inativo</option>
                </select>
              </div>
              <div class="col-12">
                <label for="barbeiro-servicos" class="form-label">Serviços <small>(Ctrl/⌘ + clique para selecionar vários)</small></label>
                <select class="form-select services-select" id="barbeiro-servicos" name="servicoIds" multiple required></select>
              </div>
            </div>
            <div class="row g-3 mt-2">
              <fieldset class="col-md-6 days-list">
                <legend class="modal-section-title">Dias de atendimento</legend>
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" role="switch" name="diasDisponiveis" value="domingo" id="dia-domingo">
                  <label class="form-check-label" for="dia-domingo">Domingo</label>
                </div>
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" role="switch" name="diasDisponiveis" value="segunda" id="dia-segunda">
                  <label class="form-check-label" for="dia-segunda">Segunda-feira</label>
                </div>
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" role="switch" name="diasDisponiveis" value="terca" id="dia-terca">
                  <label class="form-check-label" for="dia-terca">Terça-feira</label>
                </div>
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" role="switch" name="diasDisponiveis" value="quarta" id="dia-quarta">
                  <label class="form-check-label" for="dia-quarta">Quarta-feira</label>
                </div>
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" role="switch" name="diasDisponiveis" value="quinta" id="dia-quinta">
                  <label class="form-check-label" for="dia-quinta">Quinta-feira</label>
                </div>
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" role="switch" name="diasDisponiveis" value="sexta" id="dia-sexta">
                  <label class="form-check-label" for="dia-sexta">Sexta-feira</label>
                </div>
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" role="switch" name="diasDisponiveis" value="sabado" id="dia-sabado">
                  <label class="form-check-label" for="dia-sabado">Sábado</label>
                </div>
              </fieldset>
              <fieldset class="col-md-6">
                <legend class="modal-section-title">Horário de atendimento</legend>
                <label for="barbeiro-inicio" class="form-label">Início</label>
                <input type="time" class="form-control" id="barbeiro-inicio" name="horarioInicial" step="1800" required>
                <label for="barbeiro-fim" class="form-label">Fim</label>
                <input type="time" class="form-control" id="barbeiro-fim" name="horarioFinal" step="1800" required>
              </fieldset>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn-app" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn-app">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>
</body>

</html>
