<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbeiros | Zé Barbeiro</title>
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"
    defer></script>
  <script type="module" src="js/pages/admin-barbeiros.js"></script>
</head>

<body data-nav="barbeiros">
  <div id="app-header"></div>

  <main id="conteudo" class="app-main">
    <div class="container">
      <div class="page-head">
        <div>
          <h1 class="page-title">Barbeiros</h1>
          <p class="page-lead">Cadastre a equipe e defina os dias, horários e serviços de cada barbeiro.</p>
        </div>
        <button type="button" class="btn-app" id="btn-novo">Novo barbeiro</button>
      </div>
      <section class="panel" aria-label="Resultados">
        <div class="table-wrapper">
          <table class="table table-hover table-app">
            <thead>
              <tr>
                <th scope="col">Barbeiro</th>
                <th scope="col" class="hide-sm">Serviços</th>
                <th scope="col" class="hide-sm">Expediente</th>
                <th scope="col">Situação</th>
                <th scope="col"><span class="visually-hidden">Ações</span></th>
              </tr>
            </thead>
            <tbody id="tabela-registros"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <div class="modal fade" id="modal-registro" tabindex="-1" aria-labelledby="modal-registro-titulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
      <form class="modal-content" id="form-registro" novalidate>
        <div class="modal-header">
          <h2 class="modal-title" id="modal-registro-titulo"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <h3 class="modal-section-title">Dados pessoais</h3>
          <div class="row g-3">
            <div class="col-md-6">
              <label for="barbeiro-nome" class="form-label">Nome</label>
              <input type="text" class="form-control" id="barbeiro-nome" name="nome" maxlength="120" required>
            </div>
            <div class="col-md-6">
              <label for="barbeiro-telefone" class="form-label">Celular</label>
              <input type="tel" class="form-control" id="barbeiro-telefone" name="telefone" placeholder="(31)99999-9999" required>
            </div>
            <div class="col-md-6">
              <label for="barbeiro-email" class="form-label">E-mail de acesso</label>
              <input type="email" class="form-control" id="barbeiro-email" name="email" autocomplete="off" required>
            </div>
            <div class="col-md-6" data-only="create">
              <label for="barbeiro-confirmar-email" class="form-label">Confirmar e-mail</label>
              <input type="email" class="form-control" id="barbeiro-confirmar-email" name="confirmarEmail" autocomplete="off" required>
            </div>
            <div class="col-md-6">
              <label for="barbeiro-senha" class="form-label" id="label-senha">Senha</label>
              <input type="password" class="form-control" id="barbeiro-senha" name="senha" minlength="8" autocomplete="new-password">
            </div>
            <div class="col-md-6" data-only="create">
              <label for="barbeiro-confirmar-senha" class="form-label">Confirmar senha</label>
              <input type="password" class="form-control" id="barbeiro-confirmar-senha" name="confirmarSenha" autocomplete="new-password">
            </div>
            <div class="col-md-6">
              <label for="barbeiro-nascimento" class="form-label">Nascimento <span class="form-hint">(opcional)</span></label>
              <input type="date" class="form-control" id="barbeiro-nascimento" name="dataNascimento">
            </div>
            <div class="col-md-6">
              <label for="campo-ativo" class="form-label">Situação</label>
              <select class="form-select" id="campo-ativo" name="ativo">
                <option value="true">Ativo</option>
                <option value="false">Inativo</option>
              </select>
            </div>
          </div>

          <h3 class="modal-section-title mt-4">Atendimento</h3>
          <div class="row g-3">
            <div class="col-md-6">
              <label for="barbeiro-servicos" class="form-label">Serviços que realiza</label>
              <select class="form-select services-select" id="barbeiro-servicos" name="servicoIds" multiple required
                aria-describedby="barbeiro-servicos-dica"></select>
              <p class="form-hint mt-1 mb-0" id="barbeiro-servicos-dica">Segure Ctrl (ou ⌘) para selecionar vários.</p>
            </div>
            <div class="col-md-6">
              <div class="row g-3">
                <div class="col-6">
                  <label for="barbeiro-inicio" class="form-label">Início do expediente</label>
                  <input type="time" class="form-control" id="barbeiro-inicio" name="horarioInicial" step="1800" required>
                </div>
                <div class="col-6">
                  <label for="barbeiro-fim" class="form-label">Fim do expediente</label>
                  <input type="time" class="form-control" id="barbeiro-fim" name="horarioFinal" step="1800" required>
                </div>
              </div>
              <fieldset class="mt-3">
                <legend class="form-label">Dias de atendimento</legend>
                <div class="days-grid">
                  <div class="chip">
                    <input type="checkbox" name="diasDisponiveis" value="segunda" id="dia-segunda">
                    <label for="dia-segunda">Segunda</label>
                  </div>
                  <div class="chip">
                    <input type="checkbox" name="diasDisponiveis" value="terca" id="dia-terca">
                    <label for="dia-terca">Terça</label>
                  </div>
                  <div class="chip">
                    <input type="checkbox" name="diasDisponiveis" value="quarta" id="dia-quarta">
                    <label for="dia-quarta">Quarta</label>
                  </div>
                  <div class="chip">
                    <input type="checkbox" name="diasDisponiveis" value="quinta" id="dia-quinta">
                    <label for="dia-quinta">Quinta</label>
                  </div>
                  <div class="chip">
                    <input type="checkbox" name="diasDisponiveis" value="sexta" id="dia-sexta">
                    <label for="dia-sexta">Sexta</label>
                  </div>
                  <div class="chip">
                    <input type="checkbox" name="diasDisponiveis" value="sabado" id="dia-sabado">
                    <label for="dia-sabado">Sábado</label>
                  </div>
                  <div class="chip">
                    <input type="checkbox" name="diasDisponiveis" value="domingo" id="dia-domingo">
                    <label for="dia-domingo">Domingo</label>
                  </div>
                </div>
              </fieldset>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-ghost" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn-app">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="app-footer"></div>
</body>

</html>
