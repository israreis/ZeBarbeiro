<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serviços | Zé Barbeiro</title>
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"
    defer></script>
  <script type="module" src="js/pages/admin-servicos.js"></script>
</head>

<body data-nav="servicos">
  <div id="app-header"></div>

  <main id="conteudo" class="app-main">
    <div class="container">
      <div class="page-head">
        <div>
          <h1 class="page-title">Serviços</h1>
          <p class="page-lead">Preço e duração que os clientes veem ao agendar.</p>
        </div>
        <button type="button" class="btn-app" id="btn-novo">Novo serviço</button>
      </div>
      <section class="panel" aria-label="Resultados">
        <div class="table-wrapper">
          <table class="table table-hover table-app">
            <thead>
              <tr>
                <th scope="col">Serviço</th>
                <th scope="col">Preço</th>
                <th scope="col" class="hide-sm">Duração</th>
                <th scope="col">Situação</th>
                <th scope="col"><span class="visually-hidden">Ações</span></th>
              </tr>
            </thead>
            <tbody id="tabela-registros"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <div class="modal fade" id="modal-registro" tabindex="-1" aria-labelledby="modal-registro-titulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <form class="modal-content" id="form-registro" novalidate>
        <div class="modal-header">
          <h2 class="modal-title" id="modal-registro-titulo"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <p class="form-hint required-legend"><span class="required-mark" aria-hidden="true">*</span> Campos obrigatórios</p>
          <label for="servico-nome" class="form-label">Nome do serviço</label>
          <input type="text" class="form-control mb-3" id="servico-nome" name="nome" maxlength="60" required>
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label for="servico-valor" class="form-label">Preço</label>
              <input type="text" class="form-control" id="servico-valor" name="valor" placeholder="R$ 0,00" required>
            </div>
            <div class="col-6">
              <label for="servico-duracao" class="form-label">Duração (minutos)</label>
              <input type="number" class="form-control" id="servico-duracao" name="duracaoMinutos" min="5" max="480" step="5" required>
            </div>
          </div>
          <label for="campo-ativo" class="form-label">Situação</label>
          <select class="form-select" id="campo-ativo" name="ativo">
            <option value="true">Ativo</option>
            <option value="false">Inativo</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-ghost" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn-app">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="app-footer"></div>
</body>

</html>
