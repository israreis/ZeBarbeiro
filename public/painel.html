<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel | Zé Barbeiro</title>
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"
    defer></script>
  <script type="module" src="js/pages/painel.js"></script>
</head>

<body data-nav="painel">
  <div id="app-header"></div>

  <main id="conteudo" class="app-main">
    <div class="container">
      <div class="page-head">
        <div>
          <h1 class="page-title">Painel</h1>
          <p class="page-lead" data-lead></p>
        </div>
        <a class="btn-ghost" href="relatorios.html">Relatórios e exportação</a>
      </div>

      <section class="panel panel-filters" aria-label="Filtros">
        <form id="form-filtros" class="filter-form" novalidate>
          <label class="field">Período
            <select class="form-select" name="periodo"></select>
          </label>
          <label class="field" data-periodo-personalizado hidden>De
            <input class="form-control" type="date" name="inicio">
          </label>
          <label class="field" data-periodo-personalizado hidden>Até
            <input class="form-control" type="date" name="fim">
          </label>
          <label class="field field-grow" data-filtro-barbeiro>Barbeiro
            <select class="form-select" name="barbeiroId"></select>
          </label>
          <span class="filter-period" data-periodo-texto aria-live="polite"></span>
        </form>
      </section>

      <section class="kpi-grid" id="kpis" aria-label="Indicadores principais" aria-live="polite"></section>

      <div class="dashboard-grid" id="painel">
        <section class="panel chart-panel span-2" aria-labelledby="titulo-faturamento-dia">
          <h2 class="chart-title" id="titulo-faturamento-dia">Faturamento por dia</h2>
          <div data-chart="porDia"></div>
        </section>

        <section class="panel chart-panel" aria-labelledby="titulo-destaques">
          <h2 class="chart-title" id="titulo-destaques">Destaques do período</h2>
          <ul class="insights" data-insights></ul>
        </section>

        <section class="panel chart-panel" aria-labelledby="titulo-servicos">
          <h2 class="chart-title" id="titulo-servicos">Serviços mais vendidos</h2>
          <div data-chart="porServico"></div>
        </section>

        <section class="panel chart-panel" aria-labelledby="titulo-semana">
          <h2 class="chart-title" id="titulo-semana">Movimento por dia da semana</h2>
          <div data-chart="porDiaSemana"></div>
        </section>

        <section class="panel chart-panel" aria-labelledby="titulo-horas">
          <h2 class="chart-title" id="titulo-horas">Horários mais procurados</h2>
          <div data-chart="porHora"></div>
        </section>

        <section class="panel chart-panel span-2" aria-labelledby="titulo-barbeiros" data-somente-admin>
          <h2 class="chart-title" id="titulo-barbeiros">Faturamento por barbeiro</h2>
          <div data-chart="porBarbeiro"></div>
        </section>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>
</body>

</html>
