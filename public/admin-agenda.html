<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda | Zé Barbeiro</title>
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"
    defer></script>
  <script type="module" src="js/pages/admin-agenda.js"></script>
</head>

<body data-nav="atendimentos">
  <div id="app-header"></div>

  <main id="conteudo" class="app-main">
    <div class="container">
      <div class="page-head">
        <div>
          <h1 class="page-title">Agenda do dia</h1>
          <p class="page-lead">Consulte os horários de qualquer barbeiro em uma data.</p>
        </div>
        <a class="btn-ghost" href="admin-historico.html">Ver histórico</a>
      </div>
      <section class="panel panel-filters" aria-label="Filtros">
        <form id="form-agenda" class="filter-form" novalidate>
          <label class="field field-grow">Barbeiro
            <select class="form-select" name="barbeiroId" required></select>
          </label>
          <label class="field">Data
            <input class="form-control" type="date" name="data" required>
          </label>
          <button type="submit" class="btn-app">Ver agenda</button>
        </form>
      </section>
      <section class="panel" aria-label="Resultados">
        <div class="table-wrapper">
          <table class="table table-hover table-app">
            <thead>
              <tr>
                <th scope="col">Horário</th>
                <th scope="col">Cliente</th>
                <th scope="col" class="hide-sm">Serviço</th>
                <th scope="col" class="hide-sm">Valor</th>
                <th scope="col">Status</th>
              </tr>
            </thead>
            <tbody id="tabela-agenda"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <div id="app-footer"></div>
</body>

</html>
