<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
  <title>Entrar | Zé Barbeiro</title>
  <script type="module" src="js/pages/login.js"></script>
</head>

<body>
  <main class="auth">
    <aside class="auth-visual" aria-hidden="true">
      <a class="brand" href="index.html" tabindex="-1">
        <img src="img/logo.png" alt="">
        <span class="brand-name">Zé Barbeiro</span>
      </a>
      <div>
        <p class="auth-quote">Mais de quarenta anos cuidando de cabelo e barba em Belo Horizonte.</p>
        <p class="auth-quote-caption">Escolha o barbeiro, o serviço e o horário em poucos cliques.</p>
      </div>
    </aside>

    <section class="auth-content">
      <div class="auth-card">
        <a class="auth-back" href="index.html">Voltar para o site</a>
        <h1 class="auth-title">Entrar</h1>
        <p class="auth-subtitle">Acesse sua conta para agendar e acompanhar seus horários.</p>

        <form id="form-login" class="auth-form" novalidate>
          <div class="form-alert" role="alert" data-form-alert hidden></div>

          <div class="field">
            <label for="login-email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="login-email" name="email" placeholder="voce@exemplo.com"
              autocomplete="username" required autofocus>
          </div>

          <div class="field">
            <label for="login-senha" class="form-label">Senha</label>
            <input type="password" class="form-control" id="login-senha" name="senha"
              autocomplete="current-password" required>
          </div>

          <div class="auth-options">
            <div class="form-check mb-0">
              <input type="checkbox" class="form-check-input" id="login-lembrar" name="lembrar">
              <label class="form-check-label" for="login-lembrar">Manter conectado</label>
            </div>
          </div>

          <button type="submit" class="btn-app auth-submit">Entrar</button>
        </form>

        <p class="auth-switch">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
      </div>
    </section>
  </main>
</body>

</html>
